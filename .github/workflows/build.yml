name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The mod is compiled for Java 21 (Minecraft 1.21.1 target), but the current
      # Fabric Loom snapshot needs a Java 25 runtime for Gradle itself.
      - name: Set up JDK 21 (mod target)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (Gradle runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      # Any failure is surfaced as an annotation so the error is readable from the API
      # without downloading the (large) raw job log.
      - name: Validate resources
        run: |
          set +e
          ./gradlew validateResources --stacktrace --no-daemon > validate.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            summary=$(grep -A15 "What went wrong" validate.log | head -35 | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-6000)
            if [ -z "$summary" ]; then summary=$(grep -iE "could not|error|failed" validate.log | head -12 | tr '\n' '|' | cut -c1-4000); fi
            echo "::error title=validateResources failed::$summary"
            grep -A15 "What went wrong" validate.log | head -40
            exit $status
          fi
          tail -5 validate.log

      - name: Build
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error title=Build failed::$(grep -E 'error:|error \[|FAILURE|Execution failed|Could not resolve|Caused by' build.log | head -30 | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-6000)"
            grep -E 'error:|error \[|FAILURE|Execution failed|Caused by|Could not' build.log | head -60
            exit $status
          fi
          tail -20 build.log

      - name: List build output
        if: always()
        run: ls -la build/libs 2>/dev/null || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: particle-accelerator
          path: build/libs/*.jar
          if-no-files-found: error
